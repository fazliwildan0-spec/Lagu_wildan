

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WILDAN PREMIUM</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090909;color:white;
 font-family:Arial,sans-serif;padding-bottom:90px
}
header{
 padding:20px;background:#111;
 display:flex;justify-content:space-between;align-items:center;
 position:sticky;top:0;z-index:5
}
.logo{font-size:21px;font-weight:bold;color:#ff7b19}
.logo span{color:white}
button{cursor:pointer;border:0}
.search{padding:15px;background:#111}
.search input{
 width:100%;padding:14px;border-radius:25px;
 border:1px solid #333;background:#242424;color:white;
 font-size:15px;outline:none
}
.section{padding:15px}
h2{font-size:19px}
.categories{display:flex;gap:9px;overflow:auto}
.categories button{
 background:#252525;color:white;padding:10px 16px;
 border-radius:20px;white-space:nowrap
}
.categories button.active{background:#ff7918;color:black}
.grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:14px
}
.song{
 background:#171717;border-radius:13px;overflow:hidden;
 cursor:pointer;min-width:0
}
.song img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.song-info{padding:10px}
.song-title{font-size:14px;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-artist{font-size:12px;color:#aaa;margin-top:6px}
#player{
 background:#171717;margin:15px;padding:15px;
 border-radius:18px;text-align:center
}
#cover{
 width:210px;height:210px;object-fit:cover;
 border-radius:15px;margin:5px auto 15px;
 box-shadow:0 8px 30px #000
}
#nowTitle{font-size:20px;font-weight:bold}
#nowArtist{color:#aaa;margin-top:6px}
#youtube{width:100%;height:210px;border:0;border-radius:12px;margin-top:15px}
.controls{display:flex;justify-content:center;gap:20px;margin:15px}
.controls button{
 background:#ff7918;color:#111;border-radius:50%;
 width:48px;height:48px;font-size:20px
}
.tabs{display:flex;gap:10px;margin-top:20px}
.tabs button{
 flex:1;padding:12px;border-radius:10px;
 background:#292929;color:white
}
.tabs button.active{background:#ff7918;color:black}
#lyrics{
 background:#101010;padding:18px;border-radius:12px;
 white-space:pre-wrap;line-height:2;color:#ddd;
 min-height:120px;margin-top:12px
}
#lyricsInput{
 width:100%;margin-top:12px;padding:12px;
 background:#242424;color:white;border:1px solid #444;
 border-radius:10px;min-height:90px
}
.action{
 background:#ff7918;color:#111;padding:12px 16px;
 border-radius:10px;font-weight:bold;margin-top:10px
}
nav{
 position:fixed;bottom:0;left:0;right:0;
 background:#111;border-top:1px solid #292929;
 display:flex;justify-content:space-around;padding:14px 5px;
 z-index:10
}
nav button{background:none;color:#bbb;font-size:12px}
nav button.active{color:#ff7918}
.small{font-size:12px;color:#999}
</style>
</head>
<body>

<header>
 <div class="logo">WILDAN <span>PREMIUM</span></div>
 <div>♫</div>
</header>

<div class="search">
 <input id="search" placeholder="Cari lagu atau penyanyi..."
 onkeydown="if(event.key==='Enter') searchSongs()">
 <button class="action" onclick="searchSongs()">CARI LAGU</button>
</div>

<div class="section">
 <h2>Jelajahi Musik</h2>
 <div class="categories">
  <button class="active" onclick="quickSearch('lagu viral Indonesia 2026',this)">Viral Indo</button>
  <button onclick="quickSearch('viral international songs 2026',this)">Viral Barat</button>
  <button onclick="quickSearch('pop Indonesia',this)">Pop Indo</button>
  <button onclick="quickSearch('popular western pop songs',this)">Pop Barat</button>
  <button onclick="quickSearch('Kpop popular songs',this)">K-Pop</button>
 </div>
</div>

<div class="section">
 <h2>Hasil Lagu</h2>
 <div class="small" id="status">Cari lagu favoritmu.</div>
 <div class="grid" id="songList"></div>
</div>

<div class="section">
 <h2>Sedang Diputar</h2>
 <div id="player">
  <img id="cover" src="https://placehold.co/400x400/222/fff?text=WILDAN+PREMIUM">
  <div id="nowTitle">Pilih lagu terlebih dahulu</div>
  <div id="nowArtist">WILDAN PREMIUM</div>
  <div class="controls">
   <button onclick="previousSong()">⏮</button>
   <button onclick="togglePlayer()">▶</button>
   <button onclick="nextSong()">⏭</button>
  </div>
  <div class="small">Pemutar resmi YouTube</div>
  <div id="youtube"></div>

  <div class="tabs">
   <button class="active" id="lyricsTab" onclick="showTab('lyrics')">LIRIK</button>
   <button id="queueTab" onclick="showTab('queue')">ANTREAN</button>
  </div>
  <div id="lyrics">
   Lirik lagu akan ditampilkan di sini.
  </div>
  <div id="queue" style="display:none;text-align:left"></div>

  <textarea id="lyricsInput" placeholder="Masukkan lirik lagu di sini..."></textarea>
  <button class="action" onclick="saveLyrics()">SIMPAN LIRIK</button>
 </div>
</div>

<nav>
 <button class="active" onclick="scrollToTop()">⌂<br>Beranda</button>
 <button onclick="document.getElementById('search').focus()">⌕<br>Cari</button>
 <button onclick="document.getElementById('player').scrollIntoView()">♫<br>Musik</button>
 <button onclick="showTab('queue');document.getElementById('player').scrollIntoView()">☷<br>Antrean</button>
</nav>

<script>
const API_KEY = "MASUKKAN_API_KEY_KAMU";

let songs=[];
let currentIndex=-1;
let currentTab="lyrics";

async function searchSongs(){
 const query=document.getElementById("search").value.trim();
 if(!query)return;
 await getSongs(query);
}

async function quickSearch(query,button){
 document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 await getSongs(query);
}

async function getSongs(query,pageToken=""){
 if(API_KEY==="MASUKKAN_API_KEY_KAMU"){
  document.getElementById("status").innerText="Masukkan YouTube API Key terlebih dahulu.";
  return;
 }

 document.getElementById("status").innerText="Sedang mencari lagu...";
 try{
  let url=`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&maxResults=50&regionCode=ID&q=${encodeURIComponent(query)}&key=${API_KEY}`;
  if(pageToken)url+="&pageToken="+pageToken;

  const response=await fetch(url);
  const data=await response.json();
  if(data.error)throw new Error(data.error.message);

  const found=(data.items||[]).filter(item=>item.id.videoId).map(item=>({
   id:item.id.videoId,
   title:item.snippet.title,
   artist:item.snippet.channelTitle,
   image:item.snippet.thumbnails.high?.url ||
         item.snippet.thumbnails.medium?.url,
   lyrics:""
  }));

  found.forEach(song=>{
   if(!songs.some(s=>s.id===song.id))songs.push(song);
  });

  renderSongs(found);
  document.getElementById("status").innerText=
   found.length+" hasil ditemukan.";

  window.nextPageToken=data.nextPageToken||"";
 }catch(error){
  document.getElementById("status").innerText="Gagal mencari: "+error.message;
 }
}

function renderSongs(list){
 const container=document.getElementById("songList");
 container.innerHTML="";
 list.forEach(song=>{
  const index=songs.findIndex(s=>s.id===song.id);
  const card=document.createElement("div");
  card.className="song";
  const img=document.createElement("img");
  img.src=song.image;
  img.alt="Cover "+song.title;
  const info=document.createElement("div");
  info.className="song-info";
  const title=document.createElement("div");
  title.className="song-title";
  title.textContent=song.title;
  const artist=document.createElement("div");
  artist.className="song-artist";
  artist.textContent=song.artist;
  info.append(title,artist);
  card.append(img,info);
  card.onclick=()=>playSong(index);
  container.appendChild(card);
 });
}

function playSong(index){
 if(index<0||index>=songs.length)return;
 currentIndex=index;
 const song=songs[index];

 document.getElementById("cover").src=song.image;
 document.getElementById("nowTitle").textContent=song.title;
 document.getElementById("nowArtist").textContent=song.artist;
 document.getElementById("youtube").innerHTML=
 `<iframe title="Pemutar YouTube"
 src="https://www.youtube.com/embed/${song.id}?autoplay=1&rel=0"
 allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
 allowfullscreen style="width:100%;height:210px;border:0;border-radius:12px"></iframe>`;

 const saved=localStorage.getItem("lyrics_"+song.id)||"";
 document.getElementById("lyrics").textContent=
 saved||"Lirik belum tersedia. Kamu bisa memasukkan lirik sendiri di bawah.";
 document.getElementById("lyricsInput").value=saved;
 showTab("lyrics");
 renderQueue();
}

function nextSong(){
 if(currentIndex<songs.length-1)playSong(currentIndex+1);
}
function previousSong(){
 if(currentIndex>0)playSong(currentIndex-1);
}
function togglePlayer(){
 if(currentIndex>=0){
  document.getElementById("youtube").innerHTML=
  `<iframe title="Pemutar YouTube"
  src="https://www.youtube.com/embed/${songs[currentIndex].id}?autoplay=1"
  allow="autoplay; encrypted-media; picture-in-picture"
  allowfullscreen style="width:100%;height:210px;border:0;border-radius:12px"></iframe>`;
 }
}

function saveLyrics(){
 if(currentIndex<0)return alert("Pilih lagu dahulu.");
 const text=document.getElementById("lyricsInput").value;
 localStorage.setItem("lyrics_"+songs[currentIndex].id,text);
 document.getElementById("lyrics").textContent=text||"Lirik belum tersedia.";
 alert("Lirik berhasil disimpan di perangkat ini.");
}

function showTab(tab){
 currentTab=tab;
 document.getElementById("lyrics").style.display=tab==="lyrics"?"block":"none";
 document.getElementById("queue").style.display=tab==="queue"?"block":"none";
 document.getElementById("lyricsInput").style.display=tab==="lyrics"?"block":"none";
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
 document.getElementById(tab==="lyrics"?"lyricsTab":"queueTab").classList.add("active");
 if(tab==="queue")renderQueue();
}

function renderQueue(){
 const queue=document.getElementById("queue");
 queue.innerHTML="";
 songs.forEach((song,index)=>{
  const item=document.createElement("div");
  item.style.cssText="display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #333;cursor:pointer";
  const img=document.createElement("img");
  img.src=song.image;
  img.style.cssText="width:50px;height:50px;object-fit:cover;border-radius:7px";
  const text=document.createElement("div");
  text.innerHTML="";
  const title=document.createElement("b");
  title.textContent=song.title;
  const artist=document.createElement("div");
  artist.className="small";
  artist.textContent=song.artist;
  text.append(title,artist);
  item.append(img,text);
  item.onclick=()=>playSong(index);
  queue.append(item);
 });
}

function scrollToTop(){
 window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
