
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WILDAN PREMIUM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d0b;color:white;font-family:Arial,sans-serif}
header{padding:24px;background:linear-gradient(120deg,#123c2b,#07110c)}
header h1{margin:0;color:#40e68b;font-size:27px}
header p{color:#c5d8cd}
nav{display:flex;gap:10px;padding:12px;overflow:auto;background:#101813;position:sticky;top:0;z-index:5}
button{border:0;border-radius:22px;padding:10px 15px;background:#20352a;color:white;cursor:pointer}
button.active,.green{background:#1ed760;color:#06140b;font-weight:bold}
main{padding:16px;padding-bottom:130px}
input{width:100%;padding:14px;border-radius:25px;border:1px solid #34513f;background:#17231b;color:white;margin-bottom:16px}
h2{font-size:19px}
#status{color:#a7c5b2;font-size:13px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:13px}
.song{background:#142019;padding:10px;border-radius:13px;min-width:0}
.song img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#25392c}
.song b{display:block;margin-top:9px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song small{color:#a8b8ad;display:block;margin:5px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song button{padding:8px 11px;margin:2px}
#player{position:fixed;bottom:0;left:0;right:0;background:#142019;border-top:1px solid #34513f;padding:12px;z-index:10}
.playerrow{display:flex;align-items:center;gap:12px}
#cover{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#26372c}
.info{flex:1;min-width:0}
#nowTitle{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowArtist{font-size:12px;color:#a8b8ad;margin-top:4px}
audio{width:100%;height:35px;margin-top:7px}
#player button{padding:8px 12px}
.loading{opacity:.6}
</style>
</head>
<body>

<header>
<h1>WILDAN PREMIUM 🎧</h1>
<p>Dengarkan musik favoritmu kapan saja.</p>
</header>

<nav>
<button class="active" onclick="showTab('all',this)">Semua Lagu</button>
<button onclick="showTab('fav',this)">♥ Favorit</button>
<button onclick="loadMusic()">Muat Ulang</button>
</nav>

<main>
<input id="search" placeholder="Cari judul atau penyanyi..." oninput="render()">
<h2>Perpustakaan Musik</h2>
<div id="status">Sedang mengambil katalog musik...</div>
<div id="songs" class="grid"></div>
</main>

<div id="player">
<div class="playerrow">
<img id="cover" src="https://placehold.co/100x100/20352a/ffffff?text=WP">
<div class="info">
<div id="nowTitle">Belum ada lagu diputar</div>
<div id="nowArtist">Pilih lagu untuk mulai mendengarkan</div>
</div>
<button onclick="audioElement.pause()">Ⅱ</button>
</div>
<audio id="audio" controls preload="none"></audio>
</div>

<script>
const API="https://archive.org/advancedsearch.php";
const PLACEHOLDER="https://placehold.co/600x600/20352a/ffffff?text=WILDAN";

const songsBox=document.getElementById("songs");
const statusBox=document.getElementById("status");
const audioElement=document.getElementById("audio");

let songs=[];
let currentTab="all";
let favorites=JSON.parse(localStorage.getItem("wp_favorites")||"[]");
let coverCache={};

try{
 coverCache=JSON.parse(localStorage.getItem("wp_covers")||"{}");
}catch(e){coverCache={};}

// MENCARI COVER ALBUM ASLI
async function getRealCover(song){
 if(coverCache[song.id]) return coverCache[song.id];

 try{
  const query=encodeURIComponent(song.title+" "+song.artist);
  const response=await fetch(
   "https://itunes.apple.com/search?term="+query+
   "&entity=song&limit=10"
  );

  if(!response.ok) throw new Error("Cover tidak tersedia");

  const data=await response.json();
  const results=data.results||[];

  const clean=s=>s.toLowerCase()
   .replace(/[^a-z0-9 ]/g,"")
   .trim();

  const targetTitle=clean(song.title);
  const targetArtist=clean(song.artist);

  let match=results.find(item=>
   clean(item.trackName||"")===targetTitle &&
   targetArtist.includes(clean(item.artistName||""))
  );

  if(!match){
   match=results.find(item=>
    clean(item.trackName||"").includes(targetTitle) ||
    targetTitle.includes(clean(item.trackName||""))
   );
  }

  if(!match && results.length) match=results[0];

  if(match && match.artworkUrl100){
   const artwork=match.artworkUrl100.replace(
    "100x100bb","600x600bb"
   );
   coverCache[song.id]=artwork;

   try{
    localStorage.setItem("wp_covers",JSON.stringify(coverCache));
   }catch(e){}

   return artwork;
  }
 }catch(error){
  console.log("Gagal mencari cover:",song.title,error);
 }

 return PLACEHOLDER;
}

// MEMUAT KATALOG MUSIK
async function loadMusic(){
 statusBox.textContent="Mengambil katalog musik gratis...";
 songsBox.innerHTML="";

 try{
  const query="mediatype:audio AND collection:opensource_audio";
  const url=API+"?q="+encodeURIComponent(query)+
   "&fl[]=identifier&fl[]=title&fl[]=creator"+
   "&rows=1000&page=1&output=json&sort[]=downloads+desc";

  const response=await fetch(url);
  if(!response.ok) throw new Error("Katalog gagal");

  const data=await response.json();

  songs=(data.response.docs||[]).map(item=>({
   id:item.identifier,
   title:item.title||item.identifier,
   artist:Array.isArray(item.creator)
    ?item.creator.join(", ")
    :(item.creator||"Artis tidak diketahui"),
   image:coverCache[item.identifier]||PLACEHOLDER
  }));

  render();

  statusBox.textContent=
   "Ditemukan "+songs.length+
   " item katalog. Sedang mencari cover album...";

  // Cari cover satu per satu agar tidak membebani layanan
  for(let i=0;i<songs.length;i++){
   const song=songs[i];
   if(!coverCache[song.id]){
    song.image=await getRealCover(song);
   }else{
    song.image=coverCache[song.id];
   }

   // Perbarui tampilan bertahap
   if(i<80) render();

   if(i%20===0){
    statusBox.textContent=
     "Memproses cover album "+(i+1)+" dari "+songs.length;
   }
  }

  render();
  statusBox.textContent=
   "Katalog siap: "+songs.length+" lagu. Cover dicari otomatis jika tersedia.";

 }catch(error){
  statusBox.textContent=
   "Katalog gagal dimuat. Periksa koneksi internet lalu muat ulang.";
  console.error(error);
 }
}

// TAB
function showTab(tab,button){
 currentTab=tab;
 document.querySelectorAll("nav button")
  .forEach(b=>b.classList.remove("active"));
 button.classList.add("active");
 render();
}

// TAMPILKAN LAGU
function render(){
 const term=document.getElementById("search").value.toLowerCase();

 let list=songs.filter(song=>
  (song.title+" "+song.artist).toLowerCase().includes(term)
 );

 if(currentTab==="fav"){
  list=list.filter(song=>favorites.includes(song.id));
 }

 songsBox.innerHTML="";

 if(!list.length){
  songsBox.innerHTML="<p>Belum ada lagu yang cocok.</p>";
  return;
 }

 list.forEach(song=>{
  const card=document.createElement("div");
  card.className="song";

  const img=document.createElement("img");
  img.src=song.image||PLACEHOLDER;
  img.loading="lazy";
  img.alt="Cover "+song.title;
  img.onerror=()=>img.src=PLACEHOLDER;

  const title=document.createElement("b");
  title.textContent=song.title;

  const artist=document.createElement("small");
  artist.textContent=song.artist;

  const play=document.createElement("button");
  play.textContent="▶ Putar";
  play.className="green";
  play.onclick=()=>playSong(song);

  const fav=document.createElement("button");
  fav.textContent=favorites.includes(song.id)?"♥":"♡";
  fav.onclick=()=>toggleFavorite(song.id);

  card.append(img,title,artist,play,fav);
  songsBox.appendChild(card);
 });
}

// FAVORIT
function toggleFavorite(id){
 if(favorites.includes(id)){
  favorites=favorites.filter(x=>x!==id);
 }else{
  favorites.push(id);
 }

 localStorage.setItem("wp_favorites",JSON.stringify(favorites));
 render();
}

// PUTAR MUSIK
async function playSong(song){
 statusBox.textContent="Mencari file audio...";

 document.getElementById("nowTitle").textContent=song.title;
 document.getElementById("nowArtist").textContent=song.artist;
 document.getElementById("cover").src=song.image||PLACEHOLDER;

 try{
  const response=await fetch(
   "https://archive.org/metadata/"+encodeURIComponent(song.id)
  );

  if(!response.ok) throw new Error("Metadata tidak tersedia");

  const data=await response.json();
  const files=Object.values(data.files||{});

  const mp3=files.find(file=>
   file.name &&
   file.name.toLowerCase().endsWith(".mp3") &&
   !file.name.toLowerCase().includes("sample")
  );

  if(!mp3) throw new Error("MP3 tidak ditemukan");

  const path=mp3.name.split("/")
   .map(part=>encodeURIComponent(part)).join("/");

  audioElement.src=
   "https://archive.org/download/"+
   encodeURIComponent(song.id)+"/"+path;

  await audioElement.play();

  statusBox.textContent="Sedang memutar: "+song.title;

 }catch(error){
  statusBox.textContent=
   "Audio tidak tersedia atau tidak dapat diputar. Coba lagu lain.";
  console.error(error);
 }
}

loadMusic();
</script>
</body>
</html>
