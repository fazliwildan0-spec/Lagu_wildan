

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUNDIFY - Music Player</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#090909;color:white;font-family:Arial,sans-serif}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:#111;padding:25px 18px;position:fixed;top:0;bottom:90px}
.logo{font-size:27px;font-weight:bold;color:#1ed760;margin-bottom:35px}
.logo span{color:white}
.menu button{display:block;width:100%;padding:14px;margin:5px 0;background:none;border:0;color:#aaa;text-align:left;font-size:15px;cursor:pointer;border-radius:8px}
.menu button:hover,.menu button.active{background:#252525;color:white}
.main{margin-left:230px;padding:28px 30px 130px;width:calc(100% - 230px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:30px}
.top input{background:#242424;border:0;padding:13px 18px;border-radius:25px;color:white;width:min(400px,70%)}
.upload{background:#1ed760;color:black;border:0;padding:12px 16px;border-radius:25px;font-weight:bold;cursor:pointer}
h2{margin:28px 0 18px}
.sub{color:#aaa;margin-top:8px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:17px}
.song{background:#181818;padding:14px;border-radius:10px;cursor:pointer;transition:.2s}
.song:hover{background:#292929;transform:translateY(-3px)}
.cover{width:100%;aspect-ratio:1;border-radius:8px;background:linear-gradient(135deg,#1ed760,#123b27);display:flex;align-items:center;justify-content:center;font-size:45px;margin-bottom:12px}
.song h3{font-size:15px;margin-bottom:7px}
.song p{font-size:12px;color:#aaa}
.song-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.song-actions button{background:none;border:0;color:#1ed760;font-size:20px;cursor:pointer}
.player{position:fixed;bottom:0;left:0;right:0;background:#181818;border-top:1px solid #333;padding:12px 20px;display:flex;align-items:center;gap:15px;z-index:10}
.now{width:180px;min-width:100px}
.now strong{font-size:13px;display:block}
.now small{color:#aaa}
.controls{flex:1;text-align:center}
.controls button{background:none;border:0;color:white;font-size:23px;margin:0 10px;cursor:pointer}
#play{color:#1ed760;font-size:28px}
.progress{width:min(450px,90%);margin:8px auto;display:flex;align-items:center;gap:8px;font-size:11px;color:#aaa}
input[type=range]{accent-color:#1ed760;cursor:pointer}
#seek{width:100%}
.volume{width:100px}
.page{display:none}
.page.active{display:block}
.viral{background:#17291d;padding:20px;border-radius:14px;margin:25px 0}
.viral h2{margin-top:0;color:#1ed760}
iframe{width:100%;height:500px;border:0;border-radius:12px;margin-top:15px}
.empty{color:#aaa;padding:30px 0}
@media(max-width:700px){
.sidebar{width:100%;height:65px;top:auto;bottom:75px;padding:5px;z-index:5}
.logo{display:none}
.menu{display:flex;justify-content:space-around}
.menu button{font-size:11px;text-align:center;padding:10px 3px;margin:0}
.main{margin-left:0;width:100%;padding:20px 14px 160px}
.top{flex-wrap:wrap}
.top input{width:100%;order:2}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.player{padding:10px;gap:7px;flex-wrap:wrap}
.now{width:30%}
.controls{width:65%;flex:none}
.volume{display:none}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
<div class="logo">SOUND<span>IFY</span> ♪</div>
<div class="menu">
<button class="active" onclick="showPage('home',this)">⌂ Beranda</button>
<button onclick="showPage('search',this)">⌕ Cari Lagu</button>
<button onclick="showPage('favorites',this)">♥ Favorit</button>
<button onclick="showPage('library',this)">▣ Koleksi</button>
</div>
</aside>

<main class="main">
<div class="top">
<div>
<h2 style="margin:0">Selamat datang di SOUNDIFY</h2>
<p class="sub">Musik menemani setiap suasana.</p>
</div>
<label class="upload">
+ Upload MP3
<input type="file" id="fileInput" accept="audio/*" multiple hidden>
</label>
</div>

<section id="home" class="page active">
<h2>Musik Pilihan</h2>
<div class="grid" id="songList"></div>

<div class="viral">
<h2>🔥 Lagu Viral Indonesia</h2>
<p class="sub">Playlist populer dari Spotify.</p>
<iframe
src="https://open.spotify.com/embed/playlist/37i9dQZEVXbObFQZ3JLcXt?utm_source=generator&theme=0"
allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
loading="lazy">
</iframe>
</div>

<h2>Lagu Barat</h2>
<div class="grid" id="westernList"></div>
</section>

<section id="search" class="page">
<h2>Cari Musik</h2>
<input id="searchInput" placeholder="Cari judul lagu atau penyanyi..."
style="width:100%;padding:15px;background:#222;color:white;border:0;border-radius:10px">
<div class="grid" id="searchResults" style="margin-top:20px"></div>
</section>

<section id="favorites" class="page">
<h2>♥ Lagu Favorit</h2>
<div class="grid" id="favoriteList"></div>
</section>

<section id="library" class="page">
<h2>▣ Koleksi Musik Saya</h2>
<p class="sub">Lagu yang kamu unggah akan muncul di sini.</p>
<div class="grid" id="libraryList"></div>
</section>
</main>
</div>

<div class="player">
<div class="now">
<strong id="currentTitle">Belum ada lagu</strong>
<small id="currentArtist">Pilih musik untuk diputar</small>
</div>

<div class="controls">
<div>
<button onclick="previousSong()">⏮</button>
<button id="play" onclick="togglePlay()">▶</button>
<button onclick="nextSong()">⏭</button>
</div>
<div class="progress">
<span id="currentTime">0:00</span>
<input type="range" id="seek" min="0" max="100" value="0">
<span id="duration">0:00</span>
</div>
</div>

<input class="volume" id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
</div>

<audio id="audio"></audio>

<script>
const audio=document.getElementById("audio");

let songs=[
{
title:"Demo Music 1",artist:"SoundHelix",type:"indo",
url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
},
{
title:"Demo Music 2",artist:"SoundHelix",type:"indo",
url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
},
{
title:"Demo Music 3",artist:"SoundHelix",type:"indo",
url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
},
{
title:"Demo Music 4",artist:"SoundHelix",type:"barat",
url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
},
{
title:"Demo Music 5",artist:"SoundHelix",type:"barat",
url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"
},
{
title:"Demo Music 6",artist:"SoundHelix",type:"barat",
url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"
}
];

let favorites=[];
let currentIndex=-1;

function formatTime(seconds){
if(!Number.isFinite(seconds))return "0:00";
let m=Math.floor(seconds/60);
let s=Math.floor(seconds%60);
return m+":"+String(s).padStart(2,"0");
}

function renderSongs(list,container){
container.innerHTML="";
if(!list.length){
container.innerHTML='<p class="empty">Belum ada lagu.</p>';
return;
}
list.forEach(song=>{
let index=songs.indexOf(song);
let card=document.createElement("div");
card.className="song";
card.innerHTML=`
<div class="cover">♫</div>
<h3></h3><p></p>
<div class="song-actions">
<button class="heart" title="Favorit">♥</button>
<button class="playSong" title="Putar">▶</button>
</div>`;
card.querySelector("h3").textContent=song.title;
card.querySelector("p").textContent=song.artist;
card.querySelector(".playSong").onclick=()=>playSong(index);
card.querySelector(".heart").onclick=()=>{
toggleFavorite(song);
};
container.appendChild(card);
});
}

function refresh(){
renderSongs(songs.filter(s=>s.type==="indo"),document.getElementById("songList"));
renderSongs(songs.filter(s=>s.type==="barat"),document.getElementById("westernList"));
renderSongs(favorites,document.getElementById("favoriteList"));
renderSongs(songs.filter(s=>s.uploaded),document.getElementById("libraryList"));
}

function showPage(id,button){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
}

function playSong(index){
if(index<0||!songs[index])return;
currentIndex=index;
audio.src=songs[index].url;
audio.play().then(()=>{
document.getElementById("play").textContent="Ⅱ";
}).catch(()=>{
document.getElementById("play").textContent="▶";
alert("Musik belum bisa diputar. Periksa koneksi internet atau coba unggah MP3.");
});
document.getElementById("currentTitle").textContent=songs[index].title;
document.getElementById("currentArtist").textContent=songs[index].artist;
}

function togglePlay(){
if(!audio.src){
alert("Pilih lagu terlebih dahulu.");
return;
}
if(audio.paused){
audio.play();
document.getElementById("play").textContent="Ⅱ";
}else{
audio.pause();
document.getElementById("play").textContent="▶";
}
}

function nextSong(){
if(!songs.length)return;
playSong((currentIndex+1)%songs.length);
}

function previousSong(){
if(!songs.length)return;
playSong((currentIndex-1+songs.length)%songs.length);
}

function toggleFavorite(song){
if(favorites.includes(song)){
favorites=favorites.filter(s=>s!==song);
}else{
favorites.push(song);
}
refresh();
}

document.getElementById("searchInput").addEventListener("input",e=>{
let q=e.target.value.toLowerCase();
renderSongs(songs.filter(s=>
s.title.toLowerCase().includes(q)||
s.artist.toLowerCase().includes(q)
),document.getElementById("searchResults"));
});

document.getElementById("fileInput").addEventListener("change",e=>{
Array.from(e.target.files).forEach(file=>{
let url=URL.createObjectURL(file);
songs.push({
title:file.name.replace(/\.[^/.]+$/,""),
artist:"Musik Saya",
type:"indo",
url:url,
uploaded:true
});
});
refresh();
e.target.value="";
});

audio.addEventListener("timeupdate",()=>{
if(!audio.duration)return;
document.getElementById("seek").value=(audio.currentTime/audio.duration)*100;
document.getElementById("currentTime").textContent=formatTime(audio.currentTime);
document.getElementById("duration").textContent=formatTime(audio.duration);
});

document.getElementById("seek").addEventListener("input",e=>{
if(audio.duration)audio.currentTime=(e.target.value/100)*audio.duration;
});

document.getElementById("volume").addEventListener("input",e=>{
audio.volume=e.target.value;
});

audio.addEventListener("ended",nextSong);
audio.volume=.8;

refresh();
</script>
</body>
</html>
